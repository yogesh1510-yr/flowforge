name: flowforge

services:
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-flowforge}:${POSTGRES_PASSWORD:-flowforge_dev_only}@postgres:5432/${POSTGRES_DB:-flowforge}
      FLOWFORGE_ENV: ${FLOWFORGE_ENV:-dev}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  migrate:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-flowforge}:${POSTGRES_PASSWORD:-flowforge_dev_only}@postgres:5432/${POSTGRES_DB:-flowforge}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowforge}
      POSTGRES_USER: ${POSTGRES_USER:-flowforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowforge_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - flowforge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 5
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10

  airflow-db-init:
    image: postgres:17
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-flowforge_dev_only}
      POSTGRES_USER: ${POSTGRES_USER:-flowforge}
    entrypoint: ["/bin/sh", "/scripts/create_airflow_db.sh"]
    volumes:
      - ./scripts/create_airflow_db.sh:/scripts/create_airflow_db.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  kafka:
    image: quay.io/debezium/kafka:3.2
    hostname: kafka
    environment:
      CLUSTER_ID: oh-sxaDRTcyAr6pFRbXyzA
      NODE_ID: 1
      NODE_ROLE: combined
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_HOST_PORT:-19092}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-19092}:19092"
    volumes:
      - flowforge_kafka_data:/kafka/data
    healthcheck:
      test:
        - CMD
        - /kafka/bin/kafka-topics.sh
        - --bootstrap-server
        - kafka:9092
        - --list
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  connect:
    image: quay.io/debezium/connect:3.2
    ports:
      - "127.0.0.1:${CONNECT_HOST_PORT:-8083}:8083"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: "1"
      CONFIG_STORAGE_TOPIC: flowforge_connect_configs
      OFFSET_STORAGE_TOPIC: flowforge_connect_offsets
      STATUS_STORAGE_TOPIC: flowforge_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "true"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "true"

  debezium-register:
    image: python:3.12-slim
    command: ["python", "/app/register_debezium_connector.py"]
    environment:
      CONNECT_URL: http://connect:8083
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-flowforge}
      POSTGRES_USER: ${POSTGRES_USER:-flowforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowforge_dev_only}
    volumes:
      - ./scripts/register_debezium_connector.py:/app/register_debezium_connector.py:ro
    depends_on:
      connect:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    restart: "no"

  spark-projection:
    build:
      context: .
      dockerfile: infra/docker/spark.Dockerfile
    depends_on:
      debezium-register:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: flowforge.public.orders
      ORDER_PROJECTION_CHECKPOINT: /opt/spark-data/checkpoints/order-projection
      SINK_DB_HOST: postgres
      SINK_DB_PORT: "5432"
      SINK_DB_NAME: ${POSTGRES_DB:-flowforge}
      SINK_DB_USER: ${POSTGRES_USER:-flowforge}
      SINK_DB_PASSWORD: ${POSTGRES_PASSWORD:-flowforge_dev_only}
    user: "0:0"
    volumes:
      - spark_projection_checkpoints:/opt/spark-data/checkpoints
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[*]
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1
      - /opt/flowforge/src/flowforge/streaming/spark_order_projection.py

  airflow-init:
    build:
      context: .
      dockerfile: infra/docker/airflow.Dockerfile
    environment: &airflow-environment
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-flowforge}:${POSTGRES_PASSWORD:-flowforge_dev_only}@postgres:5432/flowforge_airflow
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-flowforge_admin_only}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}
      DBT_HOST: postgres
      DBT_PORT: "5432"
      DBT_USER: ${POSTGRES_USER:-flowforge}
      DBT_PASSWORD: ${POSTGRES_PASSWORD:-flowforge_dev_only}
      DBT_DATABASE: ${POSTGRES_DB:-flowforge}
      _PIP_ADDITIONAL_REQUIREMENTS: ""
    depends_on:
      postgres:
        condition: service_healthy
      airflow-db-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "/opt/airflow/init_airflow.sh"]
    volumes:
      - ./scripts/init_airflow.sh:/opt/airflow/init_airflow.sh:ro
    restart: "no"

  airflow-webserver:
    build:
      context: .
      dockerfile: infra/docker/airflow.Dockerfile
    environment: *airflow-environment
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${AIRFLOW_HOST_PORT:-8080}:8080"
    command: ["webserver"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./flowforge_analytics:/opt/airflow/flowforge_analytics
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-scheduler:
    build:
      context: .
      dockerfile: infra/docker/airflow.Dockerfile
    environment: *airflow-environment
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    command: ["scheduler"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./flowforge_analytics:/opt/airflow/flowforge_analytics

volumes:
  flowforge_postgres_data:
  flowforge_kafka_data:
  spark_projection_checkpoints:
