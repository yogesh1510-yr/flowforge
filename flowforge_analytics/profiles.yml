flowforge_analytics:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('DBT_HOST', '127.0.0.1') }}"
      port: "{{ env_var('DBT_PORT', '5434') | int }}"
      user: "{{ env_var('DBT_USER', 'flowforge') }}"
      password: "{{ env_var('DBT_PASSWORD', 'flowforge_dev_only') }}"
      dbname: "{{ env_var('DBT_DATABASE', 'flowforge') }}"
      schema: analytics_dbt
      threads: 4
